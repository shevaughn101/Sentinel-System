<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload Evidence - Sentinel Civic Response</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: "#10b981",
                        amber: "#f59e0b"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Atkinson Hyperlegible Next"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px dashed rgba(0, 0, 0, 0.15); transition: all 0.3s ease; }
        .glass-card:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.02); }
        .glass-input { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.1); color: #0f172a !important; transition: all 0.3s ease; }
        body { background: radial-gradient(circle at top right, #f8fafc, #e2e8f0); background-attachment: fixed; color: #0f172a; }
    </style>
</head>
<body class="font-body min-h-screen pb-12 pt-20 antialiased">
    <header class="fixed top-0 w-full z-50 glass-panel border-b border-slate-200 h-16 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='civilian_dashboard.html'">
                <div class="w-8 h-8 rounded-full bg-emerald text-white flex items-center justify-center shadow-md">
                    <span class="material-symbols-outlined text-[20px]">security</span>
                </div>
                <span class="font-headline font-bold text-lg text-slate-900 tracking-wide hidden sm:block">Sentinel System</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="cancel-btn" class="text-slate-500 hover:text-red-500 transition-colors text-sm font-bold tracking-wider uppercase flex items-center gap-1">
                Cancel <span class="material-symbols-outlined text-sm">close</span>
            </button>
        </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-6 mt-4 pb-20 animate-fade-in">
        <div class="mb-12 max-w-2xl mx-auto">
            <div class="flex justify-between items-center relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 -z-10 rounded-full"><div class="absolute left-0 top-0 h-full w-1/2 bg-emerald rounded-full"></div></div>
                <div class="flex flex-col items-center gap-2 px-2" style="background: transparent;">
                    <div class="w-10 h-10 rounded-full bg-emerald text-white flex items-center justify-center font-bold shadow-md"><span class="material-symbols-outlined text-[20px]">check</span></div>
                    <span class="font-label text-xs text-emerald font-bold uppercase tracking-wider">Describe</span>
                </div>
                <div class="flex flex-col items-center gap-2 px-2" style="background: transparent;">
                    <div class="w-10 h-10 rounded-full bg-emerald text-white flex items-center justify-center font-bold shadow-md">2</div>
                    <span class="font-label text-xs text-emerald font-bold uppercase tracking-wider">Evidence</span>
                </div>
                <div class="flex flex-col items-center gap-2 px-2" style="background: transparent;">
                    <div class="w-10 h-10 rounded-full bg-white border-2 border-slate-300 text-slate-400 flex items-center justify-center font-bold">3</div>
                    <span class="font-label text-xs text-slate-400 uppercase tracking-wider">Review</span>
                </div>
            </div>
        </div>

        <div class="max-w-3xl mx-auto glass-panel rounded-2xl p-8 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald to-teal-500"></div>

            <h1 class="font-headline text-2xl font-bold text-slate-900 mb-2">Upload Evidence</h1>
            <p class="font-body text-sm text-slate-600 mb-8 border-b border-slate-200 pb-4">Provide Statutory Documents and Scene Photos. Maximum 10MB per file. Accepted formats: JPG, PNG, PDF.</p>

            <form id="upload-form" class="space-y-8">
                <div>
                    <h3 class="font-headline font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                        <span class="material-symbols-outlined text-emerald">folder_shared</span> Statutory Documents
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Driver's Licence</label>
                            <input type="file" id="file-dl" accept=".pdf,image/jpeg,image/png" class="glass-input w-full rounded-lg px-4 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald/10 file:text-emerald hover:file:bg-emerald/20"/>
                        </div>
                        <div>
                            <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Vehicle Registration</label>
                            <input type="file" id="file-vr" accept=".pdf,image/jpeg,image/png" class="glass-input w-full rounded-lg px-4 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald/10 file:text-emerald hover:file:bg-emerald/20"/>
                        </div>
                        <div>
                            <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Certificate of Fitness</label>
                            <input type="file" id="file-cf" accept=".pdf,image/jpeg,image/png" class="glass-input w-full rounded-lg px-4 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald/10 file:text-emerald hover:file:bg-emerald/20"/>
                        </div>
                        <div>
                            <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Insurance Certificate</label>
                            <input type="file" id="file-ic" accept=".pdf,image/jpeg,image/png" class="glass-input w-full rounded-lg px-4 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald/10 file:text-emerald hover:file:bg-emerald/20"/>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="font-headline font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                        <span class="material-symbols-outlined text-emerald">add_a_photo</span> Scene Photos
                    </h3>
                    <div id="drop-zone" class="glass-card rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer group mb-4">
                        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 group-hover:text-emerald group-hover:bg-emerald/10 transition-colors mb-2 border border-slate-200">
                            <span class="material-symbols-outlined text-3xl">cloud_upload</span>
                        </div>
                        <h3 class="font-label text-md font-bold text-slate-900 mb-1">Select Scene Photos</h3>
                        <p class="text-xs text-slate-500 font-label">JPG or PNG only</p>
                        <input type="file" id="file-photos" multiple accept="image/jpeg,image/png" class="hidden" />
                    </div>
                    <div id="photos-list" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="upload-status" class="hidden text-sm font-label text-center py-4 rounded bg-slate-50 border border-slate-200 text-slate-700"></div>

                <div class="pt-6 border-t border-slate-200 flex justify-between">
                    <button type="button" id="back-btn" class="bg-white border border-slate-300 text-slate-700 font-bold font-label px-6 py-3 rounded-lg hover:bg-slate-50 transition-colors flex items-center gap-2 group shadow-sm">
                        <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span> Back
                    </button>
                    <button type="submit" id="continue-btn" class="bg-emerald text-white font-bold font-label px-8 py-3 rounded-lg hover:bg-emerald/90 transition-all shadow-md flex items-center gap-2 group">
                        Process & Continue <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { auth, apiFetch } from './firebase-config.js';

        let scenePhotoFiles = [];
        const filePhotosInput = document.getElementById('file-photos');
        const dropZone = document.getElementById('drop-zone');
        const photosList = document.getElementById('photos-list');

        dropZone.addEventListener('click', () => filePhotosInput.click());
        
        filePhotosInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(f => {
                if (f.size <= 10 * 1024 * 1024) scenePhotoFiles.push(f);
                else alert(`${f.name} is over 10MB.`);
            });
            renderPhotos();
            filePhotosInput.value = '';
        });

        function renderPhotos() {
            photosList.innerHTML = '';
            scenePhotoFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 text-sm font-mono text-slate-700";
                div.innerHTML = `
                    <span class="truncate max-w-[120px]">${file.name}</span>
                    <button type="button" class="text-slate-400 hover:text-red-500 material-symbols-outlined text-[16px]" onclick="removePhoto(${index})">close</button>
                `;
                photosList.appendChild(div);
            });
        }
        window.removePhoto = (index) => { scenePhotoFiles.splice(index, 1); renderPhotos(); }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('continue-btn');
            const status = document.getElementById('upload-status');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span> Processing...';
            status.classList.remove('hidden');
            status.textContent = 'Cryptographically hashing and uploading files. Please wait...';

            const formData = new FormData();
            
            // Collect Statutory Docs
            const statFiles = [
                { id: 'file-dl', name: 'Driver Licence' },
                { id: 'file-vr', name: 'Vehicle Registration' },
                { id: 'file-cf', name: 'Certificate of Fitness' },
                { id: 'file-ic', name: 'Insurance Certificate' }
            ];
            
            statFiles.forEach(sf => {
                const el = document.getElementById(sf.id);
                if (el.files[0]) {
                    // Create a new File object to rename it for the backend
                    const ext = el.files[0].name.split('.').pop();
                    const renamed = new File([el.files[0]], `${sf.name.replace(/ /g, '_')}.${ext}`, { type: el.files[0].type });
                    formData.append('files', renamed);
                }
            });

            // Collect Scene Photos
            scenePhotoFiles.forEach(f => {
                formData.append('files', f);
            });

            try {
                let statResults = [];
                let photoResults = [];

                if (formData.getAll('files').length > 0) {
                    const response = await apiFetch('http://localhost:8000/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    if (!response.ok) throw new Error("File upload failed");
                    const data = await response.json();
                    
                    // Categorize back based on prefix
                    data.files.forEach(f => {
                        if (f.name.includes("Driver_Licence") || f.name.includes("Vehicle_Registration") || 
                            f.name.includes("Certificate_of_Fitness") || f.name.includes("Insurance_Certificate")) {
                            statResults.push(f);
                        } else {
                            photoResults.push(f);
                        }
                    });
                }
                
                sessionStorage.setItem('statutoryDocs', JSON.stringify(statResults));
                sessionStorage.setItem('scenePhotos', JSON.stringify(photoResults));
                
                window.location.href = 'civilian_review.html';
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                status.classList.add('text-red-600', 'bg-red-50', 'border-red-200');
                btn.disabled = false;
                btn.innerHTML = 'Process & Continue <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>';
            }
        });

        document.getElementById('back-btn').addEventListener('click', () => { window.location.href = 'civilian_report.html'; });
        document.getElementById('cancel-btn').addEventListener('click', () => {
            if (confirm("Are you sure?")) window.location.href = 'civilian_dashboard.html';
        });

        auth.onAuthStateChanged(user => { if (!user) window.location.href = 'login.html'; });
    </script>
</body>
</html>
