<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Sentinel Civic Response</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: "#10b981",
                        amber: "#f59e0b"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Atkinson Hyperlegible Next"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Light Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #0f172a !important;
        }
        .glass-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        
        body {
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
            color: #0f172a;
        }
    </style>
</head>
<body class="font-body min-h-screen flex flex-col items-center justify-center p-6 antialiased">
    
    <div class="w-full max-w-md animate-slide-up">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald text-white mb-4 shadow-[0_4px_15px_rgba(16,185,129,0.3)]">
                <span class="material-symbols-outlined text-4xl">security</span>
            </div>
            <h1 class="font-headline text-3xl font-bold text-slate-900 mb-2 tracking-tight">Sentinel System</h1>
            <p class="text-slate-600 font-label tracking-wide">Secure Authentication Portal</p>
        </div>

        <!-- Role Toggle -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <!-- Civilian Option -->
            <label class="cursor-pointer group relative">
                <input type="radio" name="role" value="civilian" id="role-civilian" class="peer sr-only" checked />
                <div class="glass-panel rounded-xl p-5 text-center transition-all duration-300 peer-checked:bg-emerald/10 peer-checked:border-emerald/50 hover:bg-white/80">
                    <span class="material-symbols-outlined text-3xl mb-2 text-slate-400 peer-checked:text-emerald transition-colors">group</span>
                    <h3 class="font-bold text-slate-900 mb-1">Civilian Access</h3>
                    <p class="text-xs text-slate-600">Report an Incident</p>
                </div>
            </label>

            <!-- Officer Option -->
            <label class="cursor-pointer group relative">
                <input type="radio" name="role" value="officer" id="role-officer" class="peer sr-only" />
                <div class="glass-panel rounded-xl p-5 text-center transition-all duration-300 peer-checked:bg-amber/10 peer-checked:border-amber/50 hover:bg-white/80">
                    <span class="material-symbols-outlined text-3xl mb-2 text-slate-400 peer-checked:text-amber transition-colors">local_police</span>
                    <h3 class="font-bold text-slate-900 mb-1">Officer Portal</h3>
                    <p class="text-xs text-slate-600">Access Database</p>
                </div>
            </label>
        </div>

        <div class="glass-panel rounded-2xl p-8 shadow-xl relative overflow-hidden">
            <!-- Top decorative highlight -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald via-amber to-emerald"></div>

            <div id="error-message" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm font-label"></div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Email Address</label>
                    <input type="email" id="email" required class="glass-input w-full rounded-lg px-4 py-3 transition-shadow" placeholder="name@example.com">
                </div>
                
                <div>
                    <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Password</label>
                    <input type="password" id="password" required class="glass-input w-full rounded-lg px-4 py-3 transition-shadow" placeholder="••••••••">
                </div>

                <div id="signup-toggle-container" class="flex items-center">
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" id="is-signup" class="rounded border-slate-300 text-emerald focus:ring-emerald">
                        <span class="ml-2 text-sm text-slate-600 group-hover:text-slate-900 transition-colors">I don't have an account (Civilian Sign up)</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white font-bold py-3 px-4 rounded-lg hover:bg-slate-800 transition-all shadow-md flex justify-center items-center gap-2 group">
                    <span id="btn-text">Secure Login</span>
                    <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">login</span>
                </button>
            </form>

            <div id="social-logins" class="mt-8 pt-6 border-t border-slate-200">
                <p class="text-center text-xs text-slate-500 font-bold uppercase tracking-wider mb-4">Or continue with</p>
                <div class="grid grid-cols-3 gap-3">
                    <button id="google-login" type="button" class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center cursor-pointer">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    </button>
                    <button type="button" class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center opacity-50 cursor-not-allowed" title="Apple Login (Requires Paid Apple Developer Account)">
                        <img src="https://www.svgrepo.com/show/511330/apple-173.svg" class="w-5 h-5" alt="Apple">
                    </button>
                    <button id="facebook-login" type="button" class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center cursor-pointer" title="Facebook Login">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-5 h-5" alt="Facebook">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            signInWithPopup,
            googleProvider,
            appleProvider,
            facebookProvider
        } from './firebase-config.js';

        const form = document.getElementById('login-form');
        const roleCivilian = document.getElementById('role-civilian');
        const roleOfficer = document.getElementById('role-officer');
        const signupToggleContainer = document.getElementById('signup-toggle-container');
        const isSignup = document.getElementById('is-signup');
        const btnText = document.getElementById('btn-text');
        const socialLogins = document.getElementById('social-logins');
        const errorMsg = document.getElementById('error-message');

        function updateUI() {
            if (roleOfficer.checked) {
                signupToggleContainer.classList.add('hidden');
                socialLogins.classList.add('hidden');
                isSignup.checked = false;
                btnText.textContent = 'Officer Login';
            } else {
                signupToggleContainer.classList.remove('hidden');
                socialLogins.classList.remove('hidden');
                btnText.textContent = isSignup.checked ? 'Create Account' : 'Civilian Login';
            }
        }

        roleCivilian.addEventListener('change', updateUI);
        roleOfficer.addEventListener('change', updateUI);
        isSignup.addEventListener('change', updateUI);

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            errorMsg.classList.add('animate-fade-in');
        }

        async function handleAuthSuccess(userCredential) {
            try {
                const token = await userCredential.user.getIdToken();
                const response = await fetch('http://localhost:8000/api/auth/verify', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error("Backend verification failed");
                
                const data = await response.json();
                
                if (data.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                }
                else if (data.role === 'officer') {
                    if (roleCivilian.checked) throw new Error("Please use the Officer Portal");
                    window.location.href = 'officer_feed.html';
                }
                else {
                    if (roleOfficer.checked) throw new Error("Unauthorized for Officer Portal");
                    window.location.href = 'civilian_dashboard.html';
                }
            } catch (err) {
                showError(err.message);
                auth.signOut(); // Force sign out if verification fails
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span>';

            try {
                if (isSignup.checked && roleCivilian.checked) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await handleAuthSuccess(cred);
                } else {
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    await handleAuthSuccess(cred);
                }
            } catch (err) {
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-login-credentials') {
                    showError("Account not found or invalid credentials. Please click 'Sign Up' to create a new account.");
                } else {
                    showError(err.message);
                }
            } finally {
                submitBtn.disabled = false;
                updateUI(); // restores button text
            }
        });

        document.getElementById('google-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                googleProvider.setCustomParameters({ prompt: 'select_account' });
                const cred = await signInWithPopup(auth, googleProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Google Login Failed: " + err.message);
                }
            }
        });

        document.getElementById('apple-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                const cred = await signInWithPopup(auth, appleProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Apple Login Failed: " + err.message);
                }
            }
        });

        document.getElementById('facebook-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                const cred = await signInWithPopup(auth, facebookProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Facebook Login Failed: " + err.message);
                }
            }
        });
    </script>
</body>
</html>
